name: sccache on Cloudflare R2
description: >-
  Install sccache and route rustc through it when the job environment has the
  R2 bucket and credentials. Without them (for example a fork), builds run
  without sccache. With them, a server that cannot reach the bucket fails the
  job with an error annotation.
runs:
  using: composite
  steps:
    - if: env.SCCACHE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != ''
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.19.0
    - if: env.SCCACHE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != ''
      shell: bash
      env:
        SCCACHE_REGION: auto
      run: |
        # Secrets are set, so a broken cache is a config error: fail loudly
        # (GitHub emails the actor on a failed run) and show the reason.
        if ! out="$(SCCACHE_LOG=debug sccache --start-server 2>&1)"; then
          echo "$out"
          echo "::error title=sccache broken::sccache cannot use the R2 bucket (endpoint ${SCCACHE_ENDPOINT:-unset}). Fix the SCCACHE_*/R2_* secrets. Details are in this step's log."
          exit 1
        fi
        sccache --show-stats
        # Probe a real write: start-server can pass while the bucket still rejects access.
        if ! sccache --show-stats | grep -qi "cache location.*s3"; then
          echo "::error title=sccache not using R2::Cache location is not S3/R2."
          exit 1
        fi
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
