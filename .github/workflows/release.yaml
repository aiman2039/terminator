name: Release

on:
  workflow_dispatch:

# Manual runs create v<workspace version> at the selected revision. The build
# stays in this run because tags created with GITHUB_TOKEN do not trigger runs.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.95.0'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    # Branch builds warm caches in the default-branch scope, readable by tags.
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and resolve immutable revision
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag="v${version}"
          git check-ref-format "refs/tags/$tag"
          sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch ]]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != workflow_dispatch && "$EVENT_TAG" != "$tag" ]]; then
            echo "::error::Tag $EVENT_TAG must match workspace version $tag"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" || {
              echo "::error::Existing tag $tag points to another commit; select that tag to retry or bump the version."
              exit 1
            }
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha"
          else
            echo "::error::Release tag $tag does not exist"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: false
      - name: Verify native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - name: Build release package
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-release-state
        run: cargo xtask package --output target/package
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 30
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/terminator-signing.keychain-db"
          certificate="$RUNNER_TEMP/terminator-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security list-keychains -d user > "$RUNNER_TEMP/terminator-keychain-search-list.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          python3 - "$RUNNER_TEMP/terminator-keychain-search-list.txt" "$keychain" <<'PY'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[2], *original], check=True)
          PY
          openssl pkcs12 -in "$certificate" \
            -passin env:APPLE_CERTIFICATE_PASSWORD -info -noout
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$keychain" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"
          identity="$(security find-identity -v -p codesigning "$keychain" | \
            awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application:/ && index($0, team) {print $2}')"
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity for APPLE_TEAM_ID"
            exit 1
          fi
          app="target/package/Terminator.app"
          for binary in terminator terminator-daemon terminator-hook; do
            codesign --force --sign "$identity" --keychain "$keychain" \
              --options runtime --timestamp "$app/Contents/MacOS/$binary"
          done
          codesign --force --sign "$identity" --keychain "$keychain" \
            --options runtime --timestamp "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          submission="$RUNNER_TEMP/terminator-notarization.zip"
          result="$RUNNER_TEMP/terminator-notarization.json"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 20m --output-format json > "$result"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("Notarization:", r.get("id"), r.get("status")); sys.exit(0 if r.get("status") == "Accepted" else 1)' "$result"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/terminator-signing.keychain-db"
          search_list="$RUNNER_TEMP/terminator-keychain-search-list.txt"
          if [[ -f "$search_list" ]]; then
            python3 - "$search_list" <<'PY'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          PY
            rm -f "$search_list"
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/terminator-signing.p12" "$RUNNER_TEMP/terminator-notarization.zip"
      - name: Archive and inspect package
        if: needs.prepare.outputs.tag != ''
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="terminator-${TAG}-${TARGET}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --deep --strict target/package/Terminator.app
            for binary in terminator terminator-daemon terminator-hook; do
              test -x "target/package/Terminator.app/Contents/MacOS/$binary"
              file "target/package/Terminator.app/Contents/MacOS/$binary"
            done
            ditto -c -k --sequesterRsrc --keepParent target/package/Terminator.app "dist/$asset.zip"
          else
            mv target/package/terminator-linux.tar.gz "dist/$asset.tar.gz"
            mkdir -p target/package/verify
            tar -xzf "dist/$asset.tar.gz" -C target/package/verify
            for binary in terminator terminator-daemon terminator-hook; do
              path="target/package/verify/terminator/$binary"
              test -x "$path"
              file "$path"
              ldd "$path" > "$RUNNER_TEMP/$binary-ldd.txt"
              cat "$RUNNER_TEMP/$binary-ldd.txt"
              if grep -q 'not found' "$RUNNER_TEMP/$binary-ldd.txt"; then
                exit 1
              fi
            done
          fi
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.tag != ''
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and upload release assets
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
