name: CI

on:
  # Release is the only trigger; no PR, push, or branch runs.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev
      # Editor and upgrade fixtures spawn Neovim; the image has none.
      - name: Install Neovim (Windows)
        if: runner.os == 'Windows'
        run: winget install -e --id Neovim.Neovim --silent --accept-source-agreements --accept-package-agreements
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-bin: false
      - name: Formatting
        run: sh scripts/check.sh fmt
      - name: Compiler checks
        run: sh scripts/check.sh lint
      - name: Build
        run: sh scripts/check.sh build
      - name: Clippy
        run: sh scripts/check.sh clippy
      - name: Tests
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-state
        run: sh scripts/check.sh test

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Real-PTY integration stays Unix until the xtask fixtures learn ConPTY.
      # Windows runtime coverage comes from the checks job above.
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-${{ matrix.os }}
          cache-bin: false
      # cargo test does not refresh target/debug binaries. xtask launches those.
      - name: Build sibling binaries
        run: cargo build --locked --bin terminator-daemon --bin terminator-hook
      # Real PTYs, auth, hooks, reconnect, worktrees, shutdown, history, and snapshots.
      - name: Integration (real daemon)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: cargo xtask integration
      - name: Idle close (real shells)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: cargo xtask idle-close

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The two skipped tests are environment-dependent (sandboxed sockets and
      # process-group signals); they exercise nothing under coverage.
      - name: Workspace line and function coverage
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-coverage-state
        run: |
          cargo llvm-cov --workspace --all-features --locked --summary-only \
            --fail-under-lines 50 \
            -- --skip signals::tests::hangup_ends_a_spawned_process_group \
               --skip navigation_tests::reconnect_clears_transport_errors_but_preserves_failed_operations \
            | tee "$RUNNER_TEMP/coverage.txt"
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Code coverage'
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt" 2>/dev/null || echo 'coverage run failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
