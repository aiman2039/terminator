name: CI

on:
  # Release is the only trigger; no PR, push, or branch runs.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
  # sccache on Cloudflare R2 (.github/actions/sccache). Empty without the
  # secrets; builds then run without sccache.
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # TEMPORARY: Windows checks do not block the release until the
    # deleted_and_recreated_root_refreshes_and_keeps_watching hang is fixed.
    continue-on-error: ${{ matrix.os == 'windows-2025' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Windows parallel step setup contends on the runner's event.json.
      # Keep these steps sequential, including composite-action substeps.
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          # Glob skips the root-owned partial/ dir, which tar cannot read.
          path: /var/cache/apt/archives/*.deb
          key: apt-checks-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-checks-${{ matrix.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev
      # Editor and upgrade fixtures spawn Neovim; the image has none.
      # Pinned download like the native-gui job, not a floating winget install.
      # GitHub release downloads sometimes time out; retry once.
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          neovim: true
          version: v0.11.6
      - uses: rhysd/action-setup-vim@v1
        if: runner.os == 'Windows' && steps.nvim.outcome == 'failure'
        with:
          neovim: true
          version: v0.11.6
      # Windows: build on a ReFS Dev Drive. Defender scans it less, so
      # compile and link writes are faster. Only the target dir moves.
      - uses: samypr100/setup-dev-drive@v3
        if: runner.os == 'Windows'
        with:
          drive-size: 40GB
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      # Windows: less debug info (smaller objects and PDBs), the bundled
      # rust-lld linker, and one Clippy pass (scripts/check.sh).
      - name: Windows build speed settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe"
            echo "TERMINATOR_CLIPPY_ONE_PASS=1"
          } >> "$GITHUB_ENV"
      # Linux runs the tests under cargo-llvm-cov (scripts/check.sh coverage),
      # so one test build gives both the results and the coverage.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: ${{ runner.os == 'Linux' && 'rustfmt, clippy, llvm-tools-preview' || 'rustfmt, clippy' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-nextest@0.9.140,cargo-llvm-cov' || 'cargo-nextest@0.9.140' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Only this job saves the shared dev cache. Faster fixture jobs
          # restore it but must not save an incomplete cache first.
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
          # sccache holds compiled crates; this cache keeps the registry only.
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/sccache
      - name: Formatting
        run: sh scripts/check.sh fmt
      # Before Clippy: a limit failure shows in seconds, not after the build.
      - name: Size and structure limits (sarah.toml)
        if: runner.os == 'Linux'
        uses: aiman2039/sarah@v0.1.7
        with:
          path: .
          fail-on-warn: true
      # No separate compiler-check or build step: clippy type-checks every
      # target with --all-targets --all-features, and the test runner
      # rebuilds what it needs, so either step only repeats work.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: sh scripts/check.sh clippy
      # Runs after an earlier failed step too, so the test build still
      # fills sccache and the test results stay visible.
      - name: Tests
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-state
        run: sh scripts/check.sh test
      - name: Tests with coverage
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        # An explicit bash adds pipefail, so a failure is not hidden by tee.
        shell: bash
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-state
        run: sh scripts/check.sh coverage | tee "$RUNNER_TEMP/coverage.txt"
      - name: Coverage summary
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          {
            echo '### Code coverage'
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt" 2>/dev/null || echo 'coverage run failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Real-PTY integration stays Unix until the xtask fixtures learn ConPTY.
      # Windows runtime coverage comes from the checks job above.
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          # Glob skips the root-owned partial/ dir, which tar cannot read.
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-e2e-${{ matrix.os }}-
      # apt and rustup touch disjoint state, so they overlap.
      - parallel:
          - name: Install Linux build dependencies
            if: runner.os == 'Linux'
            run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential pkg-config libssl-dev libfontconfig1-dev \
                libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
                libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
                libasound2-dev libwebkit2gtk-4.1-dev
          - uses: dtolnay/rust-toolchain@stable
            with:
              toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the checks and native-gui jobs (same dev profile).
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
          # sccache holds compiled crates; this cache keeps the registry only.
          cache-targets: false
          save-if: false
      - uses: ./.github/actions/sccache
      # cargo test does not refresh target/debug binaries. xtask launches those.
      - name: Build E2E binaries together
        run: cargo build --locked -p terminator-daemon -p terminator-hook -p xtask --bins
      # Real PTYs, auth, hooks, reconnect, worktrees, shutdown, history, and snapshots.
      - name: Integration (real daemon)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: sh scripts/run-built-xtask.sh integration
      - name: Idle close (real shells)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: sh scripts/run-built-xtask.sh idle-close

  native-gui:
    name: Native GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Explicit software-compatible renderer; no automatic renderer fallback.
      TERMINATOR_FIXTURE_RENDERER: glow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          # Glob skips the root-owned partial/ dir, which tar cannot read.
          path: /var/cache/apt/archives/*.deb
          key: apt-native-gui-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-native-gui-${{ matrix.os }}-
      - name: Install Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11 openbox
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      # GitHub release downloads sometimes time out; retry once.
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        continue-on-error: true
        with:
          neovim: true
          version: v0.11.6
      - uses: rhysd/action-setup-vim@v1
        if: steps.nvim.outcome == 'failure'
        with:
          neovim: true
          version: v0.11.6
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the checks and e2e jobs (same dev profile).
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
          # sccache holds compiled crates; this cache keeps the registry only.
          cache-targets: false
          save-if: false
      - uses: ./.github/actions/sccache
      - name: Build native fixture binaries
        id: native_build
        run: |
          mkdir -p "$RUNNER_TEMP/terminator-native-gui"
          cargo build --workspace --bins --examples --features terminator/test-support --locked \
            2>&1 | tee "$RUNNER_TEMP/terminator-native-gui/build.log"
      # Release asset upload depends on this reusable workflow. Neither fixture may fail.
      # Try both fixtures after a successful build, even if the first one fails.
      - name: Native focus and new-tab directory
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/native-gui-ci.sh focus-editor-close
      - name: Native file-close, Save, Cancel, and Discard
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/native-gui-ci.sh file-close
      - name: Upload native GUI logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-gui-${{ matrix.os }}
          path: ${{ runner.temp }}/terminator-native-gui
          if-no-files-found: warn
          retention-days: 14

  # The Linux release check (#145) in the release image. Checks, E2E and
  # Native GUI (ubuntu) already run Clippy, the tests, integration and
  # idle-close, so this job runs only the steps they do not: the full GUI
  # fixture set and the debug package. The local release no longer runs it
  # in Docker and does not wait for this job; it uses the same image recipe.
  linux-release-check:
    name: Linux release check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build Linux release image
        uses: docker/build-push-action@v7
        with:
          context: scripts
          file: scripts/release-linux.Dockerfile
          load: true
          tags: terminator-release-linux:ci
          cache-from: type=gha,scope=release-linux
          cache-to: type=gha,mode=max,scope=release-linux
      - uses: ./.github/actions/sccache
      - name: Release checks (host Linux, same steps as the local Docker stage)
        run: |
          mkdir -p "$RUNNER_TEMP/linux-release-check"
          sccache="$(sh scripts/sccache-docker-args.sh)"
          # shellcheck disable=SC2086 # docker arguments without spaces in paths.
          docker run --rm --init $sccache \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src" \
            --mount "type=bind,src=$RUNNER_TEMP/linux-release-check,dst=/artifacts" \
            -e CARGO_TARGET_DIR=/build -e RUNNER_TEMP=/artifacts -e CARGO_TERM_COLOR \
            terminator-release-linux:ci \
            bash -euo pipefail -c 'git config --global --add safe.directory /src
              status=0; bash scripts/release-check.sh --only gui,package || status=$?
              # The sccache server in the container stops with it; the host
              # post-step shows an empty server, so print the real stats here.
              if command -v sccache >/dev/null; then sccache --show-stats; fi
              exit "$status"'
      - name: Upload Linux release check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-check
          path: ${{ runner.temp }}/linux-release-check
          if-no-files-found: warn
          retention-days: 14
