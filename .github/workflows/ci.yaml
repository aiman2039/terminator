name: CI

on:
  # Release is the only trigger; no PR, push, or branch runs.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Windows parallel step setup contends on the runner's event.json.
      # Keep these steps sequential, including composite-action substeps.
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-checks-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-checks-${{ matrix.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev
      # Editor and upgrade fixtures spawn Neovim; the image has none.
      # Pinned download like the native-gui job, not a floating winget install.
      - uses: rhysd/action-setup-vim@v1
        if: runner.os == 'Windows'
        with:
          neovim: true
          version: v0.11.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the e2e and native-gui jobs: same OS, same dev
          # profile, so dependency artifacts are reused across jobs.
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
      - name: Formatting
        run: sh scripts/check.sh fmt
      - name: Compiler checks
        run: sh scripts/check.sh lint
      # No separate build step: clippy compiles every target with
      # --all-targets --all-features, and the test runner rebuilds
      # what it needs, so a plain build only recompiles everything.
      - name: Clippy
        run: sh scripts/check.sh clippy
      - name: Tests
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-state
        run: sh scripts/check.sh test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Real-PTY integration stays Unix until the xtask fixtures learn ConPTY.
      # Windows runtime coverage comes from the checks job above.
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-e2e-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-e2e-${{ matrix.os }}-
      # apt and rustup touch disjoint state, so they overlap.
      - parallel:
          - name: Install Linux build dependencies
            if: runner.os == 'Linux'
            run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential pkg-config libssl-dev libfontconfig1-dev \
                libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
                libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
                libasound2-dev libwebkit2gtk-4.1-dev
          - uses: dtolnay/rust-toolchain@stable
            with:
              toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the checks and native-gui jobs (same dev profile).
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
      # cargo test does not refresh target/debug binaries. xtask launches those.
      - name: Build E2E binaries together
        run: cargo build --locked -p terminator-daemon -p terminator-hook -p xtask --bins
      # Real PTYs, auth, hooks, reconnect, worktrees, shutdown, history, and snapshots.
      - name: Integration (real daemon)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: sh scripts/run-built-xtask.sh integration
      - name: Idle close (real shells)
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-e2e-state
        run: sh scripts/run-built-xtask.sh idle-close

  native-gui:
    name: Native GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Explicit software-compatible renderer; no automatic renderer fallback.
      TERMINATOR_FIXTURE_RENDERER: glow
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare apt cache directory
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-native-gui-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-native-gui-${{ matrix.os }}-
      - name: Install Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libasound2-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11 openbox
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.6
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the checks and e2e jobs (same dev profile).
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
      - name: Build native fixture binaries
        id: native_build
        run: |
          mkdir -p "$RUNNER_TEMP/terminator-native-gui"
          cargo build --workspace --bins --examples --features terminator/test-support --locked \
            2>&1 | tee "$RUNNER_TEMP/terminator-native-gui/build.log"
      # Release builds depend on this reusable workflow. Neither fixture may fail.
      # Try both fixtures after a successful build, even if the first one fails.
      - name: Native focus and new-tab directory
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/native-gui-ci.sh focus-editor-close
      - name: Native file-close, Save, Cancel, and Discard
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/native-gui-ci.sh file-close
      - name: Upload native GUI logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-gui-${{ matrix.os }}
          path: ${{ runner.temp }}/terminator-native-gui
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # apt and rustup touch disjoint state, so they overlap. The
      # cargo-llvm-cov installer stays after: it probes the toolchain.
      - name: Prepare apt cache directory
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-coverage-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            apt-coverage-
      - parallel:
          - name: Install Linux build dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential pkg-config libssl-dev libfontconfig1-dev \
                libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
                libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
                libasound2-dev libwebkit2gtk-4.1-dev
          - uses: dtolnay/rust-toolchain@stable
            with:
              toolchain: '1.97.1'
              components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The two skipped tests are environment-dependent (sandboxed sockets and
      # process-group signals); they exercise nothing under coverage.
      - name: Workspace line and function coverage
        env:
          TERMINATOR_DATA_DIR: ${{ runner.temp }}/terminator-ci-coverage-state
        run: |
          cargo llvm-cov --workspace --all-features --locked --summary-only \
            --fail-under-lines 50 \
            -- --skip signals::tests::hangup_ends_a_spawned_process_group \
               --skip navigation_tests::reconnect_clears_transport_errors_but_preserves_failed_operations \
            | tee "$RUNNER_TEMP/coverage.txt"
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Code coverage'
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt" 2>/dev/null || echo 'coverage run failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
