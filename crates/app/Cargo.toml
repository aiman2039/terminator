[package]
name = "terminator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
terminator-core.workspace = true
terminator-integrations.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
egui-winit = { version = "0.36.1", default-features = false, optional = true }
egui_dock = { version = "0.21", features = ["serde"] }
egui_term = { path = "../../vendor/egui_term" }
open = "5"
rfd = "0.17"
pollster = "1.0"
fs2 = "0.4"
notify = "8"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui_commonmark = { version = "0.25", default-features = false, features = ["better_syntax_highlighting"] }
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"
uuid.workspace = true
wry = "0.57"
rodio = "0.21"
ureq = "2"
semver = "1"
rmp-serde = "1.3"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
tempfile = "3"
similar = { version = "3", features = ["inline"] }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "plist-load",
    "yaml-load",
    "regex-fancy",
] }

[features]
test-support = ["dep:egui-winit", "egui-winit/test-support"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"]

[dev-dependencies]
base64.workspace = true

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false
features = ["user-hooks"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSUserDefaults", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAlert", "NSMenu", "NSMenuItem"] }
