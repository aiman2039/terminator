[package]
name = "terminator-remote-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Seamless remote app windows: the Terminator display protocol and the host bridge to wprsd."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Frame payloads (both sides).
zstd = "0.13.3"

# The host bridge links wprs. wprs (through smithay) needs libxkbcommon and
# libwayland, so only Linux hosts build it; the macOS GUI and daemon use the
# protocol module only.
[target.'cfg(target_os = "linux")'.dependencies]
wprs = { path = "../../vendor/wprs" }
# Same versions as wprs, so one copy is built.
rkyv = "0.8.14"
nix = { version = "0.30.1", features = ["fs", "hostname", "socket", "user"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
anyhow.workspace = true
fallible-iterator = "0.3.0"

[[bin]]
name = "terminator-remote-bridge"
path = "src/main.rs"

[lints]
workspace = true
