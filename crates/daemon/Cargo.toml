[package]
name = "terminator-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
terminator-core.workspace = true
terminator-git.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
base64.workspace = true
portable-pty = "0.9"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
vt100 = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4"
rustix.workspace = true
notify-rust = "4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros", "process", "fs"] }
vnc = { package = "vnc-rs", version = "0.6" }
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.6"
openssh-sftp-client = "0.15"
zeroize = "1"
sha2 = "0.10"
socket2 = "0.6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
core-foundation = "0.10"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUserNotification"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
alacritty_terminal = "0.26"

[lints]
workspace = true
