[package]
name = "terminator-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
terminator-core.workspace = true
terminator-git.workspace = true
terminator-integrations.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
base64.workspace = true
portable-pty = "0.9"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
vt100 = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4"
rustix.workspace = true
notify-rust = "4"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUserNotification"] }

[build-dependencies]
cc = "1"
