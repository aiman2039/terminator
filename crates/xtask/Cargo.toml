[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
anstream = "1"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
terminator-core.workspace = true
terminator-sys = { workspace = true, features = ["desktop"] }
rustix.workspace = true
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
glob = "0.3"
rayon = "1"
fs2 = "0.4"
semver = "1"
sha2 = "0.11"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
toml_edit = "0.25"
uuid.workspace = true
xshell = "0.2"
plist = "1"
tar = "0.4"
flate2 = "1"
# Linux .deb (ar container) and .rpm packages, built in-process.
ar = "0.9"
rpm = { version = "0.30", default-features = false, features = ["payload", "gzip-compression"] }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["elcapitan"] }
core-foundation = "0.10"

[dependencies.tungstenite]
version = "0.28"
default-features = false
features = ["handshake"]

[lints]
workspace = true
