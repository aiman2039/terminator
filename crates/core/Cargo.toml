[package]
name = "terminator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
directories = "6"
dunce = "1"
libc.workspace = true
rustix.workspace = true
terminator-sys.workspace = true
terminator-remote-apps.workspace = true
toml_edit = { version = "0.25", features = ["serde"] }
# iTerm2 `.itermcolors` theme import (appearance/import.rs).
plist = "1.10"

rusqlite = { version = "0.43", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.11"
# Agent quota: Codex session log timestamps and newest-log lookup.
time = { version = "0.3", features = ["parsing"] }
walkdir = "2"
# Flow files (flow/mod.rs): cycle check of the step graph.
petgraph = { version = "0.8", default-features = false }

[features]
async-client = ["dep:tokio", "dep:tokio-util", "dep:futures-util"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt-multi-thread", "net", "time", "sync", "io-util", "process", "macros"]

[dependencies.tokio-util]
version = "0.7"
optional = true
features = ["rt"]

[dependencies.futures-util]
version = "0.3"
optional = true

[dev-dependencies]
tempfile = "3"

[dependencies.sysinfo]
version = "0.40"
default-features = false
features = ["system"]

[dependencies.url]
version = "2"

[lints]
workspace = true
