[workspace]
members = ["crates/*"]
exclude = ["vendor/egui_term", "vendor/egui_dock", "vendor/egui-winit", "vendor/vt100", "vendor/egui_commonmark", "vendor/vnc-rs"]
resolver = "2"
[workspace.package]
version = "0.139.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
[workspace.dependencies]
terminator-core = { path = "crates/core" }
terminator-git = { path = "crates/git" }
terminator-integrations = { path = "crates/integrations" }
terminator-sys = { path = "crates/sys" }
terminator-updater = { path = "crates/updater" }
anyhow = "1"
thiserror = "2"
rustix = { version = "1.1.4", features = ["fs", "process", "termios", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
libc = "0.2"
[profile.dev]
debug = 1
[profile.release]
lto = "thin"
codegen-units = 8

[patch.crates-io]
vnc-rs = { path = "vendor/vnc-rs" }
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_dock = { path = "vendor/egui_dock" }
egui-winit = { path = "vendor/egui-winit" }
vt100 = { path = "vendor/vt100" }

# `scripts/check.sh clippy` uses `-D warnings`, so every warn here fails that check.
# Pedantic is priority -1 so a later allow on one lint wins. Nursery stays off.
# string_slice is the string half of indexing_slicing.
# The allows below are pedantic docs and structure. They need signature changes,
# function splits, or boilerplate comments, and they are not the safety lints.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
missing_errors_doc = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
used_underscore_binding = "allow"
unused_self = "allow"
similar_names = "allow"
many_single_char_names = "allow"
format_push_string = "allow"
large_stack_arrays = "allow"
unreadable_literal = "allow"
unnecessary_wraps = "allow"
nonminimal_bool = "allow"
float_cmp = "allow"
ref_option = "allow"
redundant_closure_for_method_calls = "allow"
needless_continue = "allow"
naive_bytecount = "allow"
manual_let_else = "allow"
unnecessary_literal_bound = "allow"
unnecessary_debug_formatting = "allow"
struct_field_names = "allow"
semicolon_if_nothing_returned = "allow"
no_effect_underscore_binding = "allow"
large_types_passed_by_value = "allow"
large_futures = "allow"
if_not_else = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
fn_params_excessive_bools = "allow"
return_self_not_must_use = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
unused_async = "allow"
ref_option_ref = "allow"
case_sensitive_file_extension_comparisons = "allow"
trivially_copy_pass_by_ref = "allow"
result_large_err = "allow"

# Panic safety lints above are deny. cast_possible_truncation, cast_sign_loss and
# cast_possible_wrap stay at pedantic's warn (denied by -D warnings); use T::try_from(x)?
panic = "deny"
# Suppressions use #[expect(lint, reason = "...")], which errors once the lint stops firing.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
uninlined_format_args = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# User-facing output goes through one module per binary marked #[expect(clippy::print_stdout, ...)].
print_stdout = "deny"
print_stderr = "deny"
# Module roots are topic/mod.rs, never topic.rs + topic/.
self_named_module_files = "deny"
