[workspace]
members = ["crates/*"]
exclude = ["vendor/egui_term", "vendor/egui_dock", "vendor/egui-winit"]
resolver = "2"
[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
[workspace.dependencies]
terminator-core = { path = "crates/core" }
terminator-integrations = { path = "crates/integrations" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
libc = "0.2"
[profile.dev]
debug = 1
[profile.release]
lto = "thin"
codegen-units = 8

[patch.crates-io]
egui_dock = { path = "vendor/egui_dock" }
egui-winit = { path = "vendor/egui-winit" }
