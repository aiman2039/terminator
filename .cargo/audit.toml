# cargo-audit config. Keep RUSTSEC ignores in sync with deny.toml and osv-scanner.toml.
[advisories]
# Unmaintained/unsound notices only (no CVEs). All transitive except paste in vendored egui_dock.
# Replacements blocked on syntect / resvg 0.45 / egui 0.36 / wry gtk3.
ignore = [
    "RUSTSEC-2025-0141", # bincode via syntect
    "RUSTSEC-2024-0436", # paste via vendored egui_dock
    "RUSTSEC-2026-0206", # rustybuzz via resvg
    "RUSTSEC-2026-0192", # ttf-parser via resvg
    "RUSTSEC-2024-0320", # yaml-rust via syntect
    "RUSTSEC-2024-0429", # glib 0.18 via wry/gtk3
    "RUSTSEC-2024-0370", # proc-macro-error via gtk3-macros
]
